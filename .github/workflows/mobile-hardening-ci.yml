name: Mobile Hardening CI

on:
  push:
    branches:
      - feat/mobile-production-hardening
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
